name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install package and build tools
        run: python -m pip install '.[dev]'
      - name: Run tests without hardware
        run: python -m unittest discover -s tests -v
      - name: Build distributions
        run: python -m build
      - name: Check installed wheel
        run: |
          python -m venv /tmp/kanata-wheel
          /tmp/kanata-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/kanata-wheel/bin/kanata-basic --help
